spring:
  application:
    name: search
  cloud:
    nacos:
      server-addr: 192.168.128.130:8848
      discovery:
        namespace: xczx
        group: group001
      config:
        namespace: xczx
        group: group001
        file-extension: yaml
        refresh-enabled: true
        shared-configs:
          - data-id: swagger-${spring.profiles.active}.yaml
            group: xuecheng-plus-common
            refresh: true
