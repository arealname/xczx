            group: xuecheng-plus-common
            refresh: true

  profiles:
    active: dev


elasticsearch:
  hostlist: 192.168.128.130:9200
  course:
    index: course-publish
    source_fields: id,name,mt,st,grade,charge,pic,price,originalPrice,validDays
