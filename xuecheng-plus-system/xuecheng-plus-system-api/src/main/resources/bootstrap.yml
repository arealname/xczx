
#微服务配置
spring:
  application:
    name: system-service

  cloud:
    nacos:
      server-addr: 192.168.128.130:8848
      discovery:
        namespace: xczx
        group: group001

      config:
        namespace: xczx
        group: group001
        file-extension: yaml
        refresh-enabled: true
        shared-configs:
          - data-id: logging-${spring.profiles.active}.yaml
            group: xuecheng-plus-common
            refresh: true

  #profiles默认为dev
  profiles:
    active: dev

